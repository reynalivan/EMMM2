[[permission]]
identifier = "allow-browser-commands"
description = "Allows browser-related commands"
commands.allow = [
    "browser_open_tab",
    "browser_navigate",
    "browser_reload_tab",
    "browser_open_externally",
    "browser_set_zoom",
    "browser_find_in_page",
    "browser_get_adblock_enabled",
    "browser_set_adblock_enabled",
    "browser_clear_cookies_and_site_data",
    "browser_clear_cache",
    "browser_list_bookmarks",
    "browser_add_bookmark",
    "browser_delete_bookmark",
    "browser_list_history",
    "browser_clear_history",
    "browser_get_session_tabs",
    "browser_save_session_tabs",
    "browser_get_privacy_summary",
    "browser_get_homepage",
    "browser_get_retention_days",
    "browser_set_homepage",
    "browser_set_retention_days",
    "browser_list_downloads",
    "browser_cancel_download",
    "browser_pause_download",
    "browser_resume_download",
    "browser_confirm_download",
    "browser_delete_download",
    "browser_clear_old_downloads",
    "browser_reject_download",
    "browser_retry_download",
    "browser_refresh_download_link",
    "browser_open_download_source",
]
