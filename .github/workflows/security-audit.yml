name: RustSec dependency audit

on:
  pull_request:
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/**'
      - 'src-tauri/build.rs'
      - 'security/**'
      - 'scripts/audit-rust-dependencies*'
      - '.github/workflows/security-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/**'
      - 'src-tauri/build.rs'
      - 'security/**'
      - 'scripts/audit-rust-dependencies*'
      - '.github/workflows/security-audit.yml'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Test fail-closed exception policy
        run: node --test scripts/audit-rust-dependencies.test.mjs

      - name: Audit complete lockfile and validate Windows exceptions
        run: node scripts/audit-rust-dependencies.mjs "${{ runner.temp }}/rustsec-audit"

      - name: Retain full unfiltered audit and decisions
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rustsec-windows-audit
          path: ${{ runner.temp }}/rustsec-audit/
          if-no-files-found: warn
