name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      EMMM_GRAFANA_OTLP_METRICS_ENDPOINT: ${{ secrets.EMMM_GRAFANA_OTLP_METRICS_ENDPOINT }}
      EMMM_GRAFANA_OTLP_AUTHORIZATION: ${{ secrets.EMMM_GRAFANA_OTLP_AUTHORIZATION }}
      VITE_GRAFANA_FARO_URL: ${{ secrets.VITE_GRAFANA_FARO_URL }}
      VITE_GRAFANA_FARO_API_KEY: ${{ secrets.VITE_GRAFANA_FARO_API_KEY }}
      VITE_APP_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare native dependencies
        run: pnpm native:prepare

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Grafana observability configuration
        if: ${{ secrets.EMMM_GRAFANA_OTLP_METRICS_ENDPOINT != '' || secrets.EMMM_GRAFANA_OTLP_AUTHORIZATION != '' || secrets.VITE_GRAFANA_FARO_URL != '' || secrets.VITE_GRAFANA_FARO_API_KEY != '' }}
        env:
          EMMM_REQUIRE_GRAFANA_OBSERVABILITY: 'true'
        run: pnpm validate:observability

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: EMMM ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
