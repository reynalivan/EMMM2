name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish as a draft
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      EMMM_GRAFANA_OTLP_METRICS_ENDPOINT: ${{ secrets.EMMM_GRAFANA_OTLP_METRICS_ENDPOINT }}
      EMMM_GRAFANA_OTLP_AUTHORIZATION: ${{ secrets.EMMM_GRAFANA_OTLP_AUTHORIZATION }}
      VITE_GRAFANA_FARO_URL: ${{ secrets.VITE_GRAFANA_FARO_URL }}
      VITE_GRAFANA_FARO_API_KEY: ${{ secrets.VITE_GRAFANA_FARO_API_KEY }}
      VITE_APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare native dependencies
        run: pnpm native:prepare

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Test dependency exception policy
        run: node --test scripts/audit-rust-dependencies.test.mjs

      - name: Gate release on complete dependency audit
        run: node scripts/audit-rust-dependencies.mjs "${{ runner.temp }}/rustsec-audit"

      - name: Retain complete release audit
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-rustsec-audit
          path: ${{ runner.temp }}/rustsec-audit/
          if-no-files-found: warn

      - name: Validate Grafana observability configuration
        if: ${{ env.EMMM_GRAFANA_OTLP_METRICS_ENDPOINT != '' || env.EMMM_GRAFANA_OTLP_AUTHORIZATION != '' || env.VITE_GRAFANA_FARO_URL != '' || env.VITE_GRAFANA_FARO_API_KEY != '' }}
        env:
          EMMM_REQUIRE_GRAFANA_OBSERVABILITY: 'true'
        run: pnpm validate:observability

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: EMMM ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: true
