name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm vitest run

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Type bindings drift guard
        # `git add -N` first: a plain `git diff` ignores untracked files, so an
        # uncommitted generated file would silently pass this gate.
        run: |
          git add -N src/lib/bindings.gen.ts
          git diff --exit-code src/lib/bindings.gen.ts

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: pnpm build

  e2e:
    runs-on: windows-latest
    # The WDIO suite drives the real Tauri binary through tauri-driver +
    # msedgedriver. It has no green history on CI yet, so it reports without
    # blocking the pipeline; drop this flag once it has proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Separate cache key: this job builds the app with `tauri build --debug`,
          # which produces different artifacts than the test job's `cargo test`.
          key: e2e

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # wdio.conf.ts `onPrepare` builds the app itself, with the E2E identifier
      # override that gives the run its own app_data. Pre-building here would
      # only produce a binary it discards.
      - name: Run E2E suite
        run: pnpm test:e2e
