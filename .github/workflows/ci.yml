name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Use long Windows temporary path
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare native dependencies
        run: pnpm native:prepare

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture lint
        run: pnpm lint:arch

      - name: Frontend tests
        run: pnpm vitest run

      - name: Dependency policy tests
        run: node --test scripts/audit-rust-dependencies.test.mjs

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Type bindings drift guard
        # `git add -N` first: a plain `git diff` ignores untracked files, so an
        # uncommitted generated file would silently pass this gate.
        run: |
          git add -N src/shared/api/tauri/bindings.gen.ts
          git diff --exit-code src/shared/api/tauri/bindings.gen.ts

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: SQLx metadata drift guard
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo install sqlx-cli --version 0.8.6 --no-default-features --features sqlite --locked
          $env:DATABASE_URL = "sqlite://.sqlx-ci.db"
          $env:SQLX_OFFLINE = "false"
          cargo sqlx database create
          cargo sqlx migrate run
          cargo sqlx prepare --check -- --all-targets --all-features
          Remove-Item -LiteralPath .sqlx-ci.db -Force -ErrorAction SilentlyContinue

      - name: Build
        run: pnpm build

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use long Windows temporary path
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare native dependencies
        run: pnpm native:prepare

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Separate cache key: this job builds the app with `tauri build --debug`,
          # which produces different artifacts than the test job's `cargo test`.
          key: e2e

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Ensure WebView2 Runtime for native startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-WebViewRuntimeVersion {
            $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client")) {
              if (Test-Path -LiteralPath $key) {
                $value = (Get-ItemProperty -LiteralPath $key).pv
                $parsed = $null
                if ([version]::TryParse($value, [ref]$parsed) -and $parsed -gt [version]'0.0.0.0') { return $parsed }
              }
            }
          }
          $runtime = Get-WebViewRuntimeVersion
          if (-not $runtime) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation(,|$)') {
              throw 'WebView2 bootstrapper does not have a valid Microsoft publisher signature'
            }
            $installed = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -Wait -PassThru -WindowStyle Hidden
            if ($installed.ExitCode -ne 0) { throw "WebView2 installer failed: $($installed.ExitCode)" }
            $runtime = Get-WebViewRuntimeVersion
          }
          if (-not $runtime) { throw 'WebView2 Runtime is unavailable after setup' }
          Write-Output "WebView2 Runtime: $runtime; Windows session: $([Diagnostics.Process]::GetCurrentProcess().SessionId)"

      - name: Native startup gate
        run: pnpm test:e2e --spec tests/e2e/specs/app-bootstrap.e2e.ts

      # wdio.conf.ts `onPrepare` builds the app itself, with the E2E identifier
      # override that gives the run its own app_data. Pre-building here would
      # only produce a binary it discards.
      - name: Run E2E suite
        run: pnpm test:e2e

      - name: Preserve isolated native startup evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-e2e-evidence
          path: |
            .audit-output/native-e2e/
            ~/AppData/Local/com.reynalivan.emmm.e2e/logs/
            ~/AppData/Roaming/com.reynalivan.emmm.e2e/logs/
          if-no-files-found: warn
