name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare native dependencies
        run: pnpm native:prepare

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture lint
        run: pnpm lint:arch

      - name: Frontend tests
        run: pnpm vitest run

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Type bindings drift guard
        # `git add -N` first: a plain `git diff` ignores untracked files, so an
        # uncommitted generated file would silently pass this gate.
        run: |
          git add -N src/shared/api/tauri/bindings.gen.ts
          git diff --exit-code src/shared/api/tauri/bindings.gen.ts

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: SQLx metadata drift guard
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo install sqlx-cli --version 0.8.6 --no-default-features --features sqlite --locked
          $env:DATABASE_URL = "sqlite://.sqlx-ci.db"
          $env:SQLX_OFFLINE = "false"
          cargo sqlx database create
          cargo sqlx migrate run
          cargo sqlx prepare --check -- --all-targets --all-features
          Remove-Item -LiteralPath .sqlx-ci.db -Force -ErrorAction SilentlyContinue

      - name: Build
        run: pnpm build

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare native dependencies
        run: pnpm native:prepare

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Separate cache key: this job builds the app with `tauri build --debug`,
          # which produces different artifacts than the test job's `cargo test`.
          key: e2e

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # wdio.conf.ts `onPrepare` builds the app itself, with the E2E identifier
      # override that gives the run its own app_data. Pre-building here would
      # only produce a binary it discards.
      - name: Run E2E suite
        run: pnpm test:e2e
