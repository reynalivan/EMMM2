apiVersion: 1
groups:
  - orgId: 1
    name: emmm-reliability
    folder: EMMM
    interval: 1h
    rules:
      - uid: emmm-error-rate-24h
        title: EMMM error rate exceeds 2 percent
        condition: C
        data:
          - refId: A
            datasourceUid: __PROMETHEUS_DATASOURCE_UID__
            relativeTimeRange: {from: 86400, to: 0}
            model: {expr: 'sum(increase(emmm_operation_total{outcome="failed"}[24h]))', refId: A}
          - refId: B
            datasourceUid: __PROMETHEUS_DATASOURCE_UID__
            relativeTimeRange: {from: 86400, to: 0}
            model: {expr: 'sum(increase(emmm_operation_total[24h]))', refId: B}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {type: math, expression: '$A / $B > 0.02 && $B >= 20', refId: C}
      - uid: emmm-reconcile-watcher-failures-24h
        title: EMMM watcher or reconcile failures exceed 10 percent
        condition: C
        data:
          - refId: A
            datasourceUid: __PROMETHEUS_DATASOURCE_UID__
            relativeTimeRange: {from: 86400, to: 0}
            model: {expr: 'sum(increase(emmm_operation_total{operation=~"watcher|reconcile",outcome="failed"}[24h]))', refId: A}
          - refId: B
            datasourceUid: __PROMETHEUS_DATASOURCE_UID__
            relativeTimeRange: {from: 86400, to: 0}
            model: {expr: 'sum(increase(emmm_operation_total{operation=~"watcher|reconcile"}[24h]))', refId: B}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {type: math, expression: '$A / $B > 0.1 && $B >= 5', refId: C}
