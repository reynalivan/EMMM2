<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMMM</title>
    <style>
      /* A restrained static bloom gives the startup mark a backdrop without becoming scenery. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #0a0d13;
        color: #edf2ff;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 160ms ease-out;
      }

      #splash::before {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70% 45% at 50% 38%, rgba(87, 124, 198, 0.18), transparent 72%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 36%);
        content: '';
        pointer-events: none;
      }

      #splash.is-done {
        pointer-events: none;
        opacity: 0;
      }

      #splash .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      #splash .logo {
        width: 3.25rem;
        height: 3.25rem;
        color: #7fa6ff;
      }

      #splash .logo rect {
        display: none;
      }

      #splash .title {
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      #splash .status {
        display: grid;
        width: 1.5rem;
        height: 1.5rem;
        place-items: center;
      }

      #splash .status::after {
        width: 1.375rem;
        height: 1.375rem;
        border-radius: 50%;
        background: conic-gradient(
          from 20deg,
          rgba(127, 166, 255, 0.1),
          rgba(127, 166, 255, 0.24) 32%,
          #7fa6ff 58%,
          rgba(127, 166, 255, 0.1) 82%
        );
        content: '';
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        animation: splash-status-spin 900ms linear infinite;
      }

      @keyframes splash-status-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }

        #splash .status::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Loading EMMM">
      <div class="content">
        <svg class="logo" viewBox="0 0 450 450" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="450" height="450" rx="122" />

          <path
            class="logo-stroke"
            d="M302.783 63.75H136.5C98.1162 63.75 67 94.8662 67 133.25C67 171.634 98.1162 202.75 136.5 202.75H189.996C208.55 202.75 226.428 195.779 240.086 183.22L370 63.75V171.5"
            stroke="currentColor"
            stroke-width="34"
            stroke-miterlimit="16"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            class="logo-stroke"
            d="M299 247H136.5C98.1162 247 67 278.116 67 316.5C67 354.884 98.1162 386 136.5 386H296C336.869 386 370 352.869 370 312V304"
            stroke="currentColor"
            stroke-width="34"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle cx="136.5" cy="132.5" r="40.5" fill="currentColor" />
          <circle cx="300.5" cy="316.5" r="40.5" fill="currentColor" />
        </svg>
        <div class="title">EMMM</div>
        <div class="status" aria-hidden="true"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/app/entrypoint/main.tsx"></script>
  </body>
</html>
